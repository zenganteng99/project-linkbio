name = "customlink-webhook"
main = "worker.js"
compatibility_date = "2026-09-26"
workers_dev = true
account_id = "5b88f222d36927af58324572423be844"

[observability]
enabled = true

# ----------------------------------------------------------------------
# CRON TRIGGER - Orphan Garbage Collector
# Jadwal: Setiap 5 hari jam 20:00 + Safety buffer 48 jam
# ----------------------------------------------------------------------
[triggers]
crons = ["0 20 */5 * *"]

# ---------------------------------------------------------------------------
# CLOUDFLARE R2 STORAGE - Image Asset Management
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "customlink-assets"
# ---------------------------------------------------------------------------
# VARIABEL NON-RAHASIA (aman commit)
# ---------------------------------------------------------------------------
[vars]
MERCHANT_ID = "216620090026052421673"
CLIENT_ID = "2026092618040865582354"
DANA_ENV = "sandbox"
DANA_ORIGIN = "https://customlink.pages.dev"
SUB_MERCHANT_ID = "d5831d89"
DANA_CHANNEL_ID = "95221"
PRIMARY_DOMAIN = "https://customlink-webhook.modernshopp.workers.dev"
