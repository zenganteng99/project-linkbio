    <script>
        const SB_URL = "https://aonbjbcytrpjaxuhyucq.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvbmJqYmN5dHJwamF4dWh5dWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDMxMTYsImV4cCI6MjEwNTcxOTExNn0.0ox4fRqRPM1VR9J9KSVZfGlc72BXsIcnmJKen4W5tE0";
        
        const sbClient = window.supabase.createClient(SB_URL, SB_KEY);
        
        let currentProducts = [];
        let appliedDiscount = 0; // 0 atau 30 (persen)
        let isEndorseVoucher = false;
        let activeEndorseCode = "";
        
        function getSlug() { 
            const params = new URLSearchParams(location.search);
            if (params.get("slug")) return params.get("slug");
            if (params.get("p")) return params.get("p");
            const pathSegments = window.location.pathname.split("/").filter(Boolean);
            if (pathSegments.length > 0 && !pathSegments[0].includes('.html')) {
                return pathSegments[0];
            }
            return "default"; 
        }
        
        function fmt(p) { 
            if (!p) return ""; 
            const n = parseInt(p.toString().replace(/[^0-9]/g, "")); 
            if (isNaN(n)) return p;
            
            let finalPrice = n;
            if (isEndorseVoucher) {
                finalPrice = 0; // Diskon 100% jadi Rp 0
            } else if (appliedDiscount > 0) {
                finalPrice = n - (n * appliedDiscount / 100);
            }

            if (finalPrice === 0 && (isEndorseVoucher || appliedDiscount > 0)) {
                return `<span class="line-through text-gray-400 text-xs mr-2">Rp ${n.toLocaleString("id-ID")}</span> <span class="text-green-600 font-extrabold">GRATIS (ENDORSE)</span>`;
            }
            if (appliedDiscount > 0) {
                return `<span class="line-through text-gray-400 text-xs mr-2">Rp ${n.toLocaleString("id-ID")}</span> <span class="text-pink-600 font-extrabold">Rp ${finalPrice.toLocaleString("id-ID")}</span>`;
            }
            return "Rp " + n.toLocaleString("id-ID"); 
        }
        
        async function fetchSettings(slug) {
            const { data, error } = await sbClient.from("settings").select("client_slug, profile_name, hero_title, hero_subtitle, background_url, profile_image_url, theme_style, instagram_link, instagram_active, tiktok_link, tiktok_active, whatsapp_link, whatsapp_active").eq("client_slug", slug).limit(1);
            if (error) { console.error("Settings error:", error); return slug !== "default" ? await fetchSettings("default") : null; }
            if (data && data.length > 0) return data[0];
            return slug !== "default" ? await fetchSettings("default") : null;
        }
        
        async function fetchProducts(slug) {
            const { data, error } = await sbClient.from("products").select("id, title, price, image_url, affiliate_link, sort_order, is_active").eq("client_slug", slug).eq("is_active", true).order("sort_order", { ascending: true });
            if (error) { console.error("Products error:", error); return []; }
            return data || [];
        }
        
        // --- Logika Validasi Voucher (Endorse 100% atau Affiliate 30%) ---
        async function applyVoucher() {
            const code = document.getElementById("voucher-input").value.trim().toLowerCase();
            const statusEl = document.getElementById("voucher-status");
            if (!code) return;

            statusEl.classList.remove("hidden");
            statusEl.textContent = "Mengecek voucher...";
            statusEl.className = "text-xs mt-2 text-yellow-400 font-medium";

            try {
                // 1. Cek apakah ini Voucher Endorse 100%
                const { data: endorseData, error: endorseErr } = await sbClient
                    .from("endorse_vouchers")
                    .select("*")
                    .eq("endorse_code", code)
                    .single();

                if (endorseData) {
                    if (endorseData.is_used) {
                        statusEl.textContent = "❌ Voucher endorse ini sudah pernah digunakan!";
                        statusEl.className = "text-xs mt-2 text-red-400 font-medium";
                        return;
                    }
                    // Voucher endorse valid!
                    isEndorseVoucher = true;
                    activeEndorseCode = endorseData.endorse_code;
                    appliedDiscount = 100;
                    statusEl.textContent = "🎉 Voucher Endorse Berhasil! Diskon 100% Aktif.";
                    statusEl.className = "text-xs mt-2 text-green-400 font-bold";
                    renderProducts(currentProducts);
                    return;
                }

                // 2. Jika bukan endorse, cek apakah ini Voucher Afiliasi Influencer Publik (Diskon 30%)
                const { data: infData, error: infErr } = await sbClient
                    .from("influencers")
                    .select("*")
                    .ilike("voucher_code", code)
                    .single();

                if (infData) {
                    isEndorseVoucher = false;
                    appliedDiscount = infData.discount_percent || 30;
                    statusEl.textContent = `✅ Voucher Berhasil! Diskon ${appliedDiscount}% Aktif.`;
                    statusEl.className = "text-xs mt-2 text-green-400 font-bold";
                    renderProducts(currentProducts);
                    return;
                }

                statusEl.textContent = "❌ Kode voucher tidak ditemukan atau tidak valid.";
                statusEl.className = "text-xs mt-2 text-red-400 font-medium";
            } catch (err) {
                console.error("Voucher check error:", err);
                statusEl.textContent = "❌ Terjadi kesalahan saat memeriksa voucher.";
                statusEl.className = "text-xs mt-2 text-red-400 font-medium";
            }
        }

        // --- Simulasi Checkout / Pembelian Produk ---
        function handleCheckout(productTitle, productPrice, affiliateLink) {
            if (isEndorseVoucher) {
                // Jika pakai voucher endorse, setelah klik beli langsung muncul modal pendaftaran influencer
                document.getElementById("influencer-modal").classList.remove("hidden");
            } else {
                // Pembelian biasa diarahkan ke link affiliate produk
                window.open(affiliateLink || '#', '_blank');
            }
        }

        // --- Menyimpan Data Influencer & Mengunci Voucher Endorse ---
        async function submitInfluencerData() {
            const slug = document.getElementById("inf_slug").value.trim().toLowerCase();
            const voucher = document.getElementById("inf_voucher").value.trim().toUpperCase();
            const whatsapp = document.getElementById("inf_whatsapp").value.trim();
            const bankName = document.getElementById("inf_bank_name").value.trim();
            const bankAcc = document.getElementById("inf_bank_account").value.trim();
            const bankHolder = document.getElementById("inf_bank_holder").value.trim();

            if (!slug || !voucher || !whatsapp || !bankName || !bankAcc || !bankHolder) {
                alert("Mohon lengkapi semua kolom form!");
                return;
            }

            try {
                // 1. Masukkan data ke tabel influencers
                const { error: insErr } = await sbClient.from("influencers").insert([{
                    client_slug: slug,
                    voucher_code: voucher,
                    discount_percent: 30,
                    whatsapp: whatsapp,
                    bank_name: bankName,
                    bank_account: bankAcc,
                    bank_holder: bankHolder
                }]);

                if (insErr) throw insErr;

                // 2. Tandai voucher endorse sebagai sudah terpakai (is_used = true)
                const { error: updErr } = await sbClient.from("endorse_vouchers")
                    .update({ is_used: true })
                    .eq("endorse_code", activeEndorseCode);

                if (updErr) throw updErr;

                alert("🎉 Pendaftaran Berhasil! Akun influencer Anda sudah aktif.");
                document.getElementById("influencer-modal").classList.add("hidden");
                
                // Redirect ke halaman admin mereka
                window.location.href = `admin.html?slug=${slug}`;
            } catch (err) {
                console.error("Gagal mendaftarkan influencer:", err);
                alert("Gagal menyimpan data. Pastikan Client Slug belum digunakan orang lain.");
            }
        }
        
        function renderHero(s) {
            if (s) {
                if (s.profile_name) document.getElementById("profile-name").textContent = s.profile_name;
                if (s.hero_title) document.getElementById("hero-title").textContent = s.hero_title;
                if (s.hero_subtitle) document.getElementById("hero-subtitle").textContent = s.hero_subtitle;
                if (s.background_url) {
                    document.getElementById("hero-bg").style.backgroundImage = `url('${s.background_url}')`;
                }
                if (s.profile_image_url) {
                    const pImg = document.getElementById("profile-image");
                    pImg.style.backgroundImage = `url('${s.profile_image_url}')`;
                    pImg.style.backgroundSize = "cover";
                    pImg.style.backgroundPosition = "center";
                    pImg.innerHTML = "";
                }
                const bodyEl = document.body;
                const profileInfoEl = document.querySelector('.text-center.mb-8');
                const footerCredit = document.getElementById("footer-credit");
                const footerBrand = document.getElementById("footer-brand");

                bodyEl.className = "min-h-screen antialiased selection:bg-pink-500 selection:text-white ";

                } else {
                    profileInfoEl.classList.remove('text-gray-900');

                    document.getElementById("hero-title").className = "text-sm font-semibold text-pink-300 mt-1 tracking-wide uppercase opacity-90";

                    footerBrand.className = "font-semibold text-white/70";
                }
                renderSocialLinks(s, theme);
            }
        }

            }
            if (s.tiktok_active !== false && s.tiktok_link) {
                html += `<a href="${s.tiktok_link}" target="_blank" rel="noopener noreferrer" class="${btnClass}" title="TikTok"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg></a>`;
            }
            if (s.whatsapp_active !== false && s.whatsapp_link) {
                html += `<a href="${s.whatsapp_link}" target="_blank" rel="noopener noreferrer" class="${btnClass}" title="WhatsApp"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg></a>`;
            }
            container.innerHTML = html;
            container.classList.toggle('hidden', html === '');
        }
        
        function renderProducts(ps) {
            currentProducts = ps;
            const c = document.getElementById("products-container");
            if (!ps || !ps.length) { 
                c.innerHTML = '<p class="text-center text-gray-500 text-sm font-medium">Belum ada produk aktif.</p>'; 
                return; 
            }
            c.innerHTML = ps.map((p, i) => {
                const badge = i < 3 ? '<div class="absolute -top-2.5 -left-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-lg z-10 tracking-wider">TOP #' + (i + 1) + '</div>' : '';
                const imgHtml = p.image_url 
                    ? `<img src="${p.image_url}" alt="${p.title || 'Produk'}" width="64" height="64" loading="lazy" class="w-16 h-16 rounded-xl object-cover shadow-md group-hover:scale-105 transition-transform duration-300" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="w-16 h-16 bg-gray-100 rounded-xl hidden items-center justify-center text-2xl shadow-inner">📦</div>`
                    : `<div class="w-16 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-2xl shadow-inner">📦</div>`;

                return `<div class="product-glass rounded-2xl p-3.5 shadow-xl relative overflow-hidden group">
                    <div onclick="handleCheckout('${p.title}', '${p.price}', '${p.affiliate_link}')" class="block cursor-pointer">
                        <div class="flex gap-4 items-center">
                            <div class="relative flex-shrink-0 w-16 h-16">${imgHtml}${badge}</div>
                            <div class="flex-1 min-w-0 pr-1">
                                <h3 class="font-bold text-gray-900 text-sm sm:text-base leading-snug line-clamp-2 group-hover:text-pink-600 transition-colors">${p.title || ''}</h3>
                                <p class="text-pink-600 font-extrabold text-sm sm:text-base mt-0.5">${fmt(p.price)}</p>
                                <div class="mt-2.5 inline-flex items-center gap-1.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-pink-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-md btn-shine transition-all">
                                    <span>${isEndorseVoucher ? 'Klaim / Checkout Gratis' : 'Beli Sekarang'}</span>
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join("");
        }
        
        async function init() {
            const slug = getSlug();
            document.title = "Bio Link - " + slug;
            const cacheKey = `bio_cache_${slug}`;
            const cachedData = sessionStorage.getItem(cacheKey);
            
            if (cachedData) {
                try {
                    const { settings, products } = JSON.parse(cachedData);
                    renderHero(settings);
                    renderProducts(products);
                    backgroundSync(slug, cacheKey);
                    return;
                } catch (e) {
                    sessionStorage.removeItem(cacheKey);
                }
            }
            await loadAndRender(slug, cacheKey);
        }

        async function loadAndRender(slug, cacheKey) {
            const [settings, products] = await Promise.all([fetchSettings(slug), fetchProducts(slug)]);
            try { sessionStorage.setItem(cacheKey, JSON.stringify({ settings, products })); } catch (e) {}
            renderHero(settings);
            renderProducts(products);
        }

        async function backgroundSync(slug, cacheKey) {
            try {
                const [settings, products] = await Promise.all([fetchSettings(slug), fetchProducts(slug)]);
                sessionStorage.setItem(cacheKey, JSON.stringify({ settings, products }));
            } catch (e) {}
        }
        
        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
