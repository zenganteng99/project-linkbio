    <script>
        const WORKER_ORIGIN = window.location.hostname.includes("customlink.id") 
            ? window.location.origin 
            : "https://customlink-webhook.modernshopp.workers.dev";
            
        const TRACK_ENDPOINT = `${WORKER_ORIGIN}/api/track`;
        const STORE_ENDPOINT = `${WORKER_ORIGIN}/api/public/store`;

        let globalProducts = [];
        
        function getSlug() { 
            const params = new URLSearchParams(location.search);
            if (params.get("slug")) return params.get("slug");
            if (params.get("p")) return params.get("p");
            
            const pathSegments = window.location.pathname.split("/").filter(Boolean);
            if (pathSegments.length > 0) {
                const lastSegment = pathSegments[pathSegments.length - 1].toLowerCase();
                const isSystemRoute = lastSegment.includes('.html') || ['landingpage', 'admin', 'store'].includes(lastSegment);
                if (!isSystemRoute) {
                    return lastSegment;
                }
            }
            return "default"; 
        }

        function sendEvent(eventType, targetId = "") {
            try {
                const currentSlug = getSlug();
                const payload = JSON.stringify({
                    clientSlug: currentSlug,
                    eventType: eventType,
                    targetId: String(targetId || ""),
                    referrer: document.referrer || "direct"
                });

                fetch(TRACK_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: payload,
                    keepalive: true,
                    mode: "cors"
                }).catch(function() {});
            } catch (err) {}
        }
        
        function fmt(p) { 
            if (!p) return ""; 
            const n = parseInt(p.toString().replace(/[^0-9]/g, "")); 
            return isNaN(n) ? p : "Rp " + n.toLocaleString("id-ID"); 
        }

        function extractNumericPrice(p) {
            if (!p) return 0;
            const n = parseInt(p.toString().replace(/[^0-9]/g, ""));
            return isNaN(n) ? 0 : n;
        }

                t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
                document,'script','https://connect.facebook.net/en_US/fbevents.js');
                
                fbq('init', fbId);
                fbq('track', 'PageView');

            }

            if (ttId && !window._ttq_loaded) {

        }

        function trackPixelProductClick(title, price) {
            const numPrice = extractNumericPrice(price);

            if (window.fbq) {
                fbq('track', 'InitiateCheckout', {
                    content_name: title,
                    value: numPrice,
                    currency: 'IDR'
                });
            }

            if (window.ttq) {
                ttq.track('InitiateCheckout', {
                    content_name: title,
                    value: numPrice,
                    currency: 'IDR'
                });
            }

            if (window.gtag) {
                gtag('event', 'begin_checkout', {
                    currency: 'IDR',
                    value: numPrice,
                    items: [{ item_name: title, price: numPrice }]
                });
            }
        }
        
        async function fetchStoreData(slug) {
            try {
                const res = await fetch(`${STORE_ENDPOINT}?slug=${encodeURIComponent(slug)}`);
                if (!res.ok) throw new Error("Gagal mengambil data dari Edge");
                const data = await res.json();
                
                if ((!data.settings || !data.products || data.products.length === 0) && slug !== "default") {
                    const defRes = await fetch(`${STORE_ENDPOINT}?slug=default`);
                    if (defRes.ok) return await defRes.json();
                }
                return data;
            } catch (err) {
                console.error("Store cache fetch error:", err);
                return { settings: null, products: [] };
            }
        }

                } else {
                    profileInfoEl.classList.remove('text-gray-900');
                    profileInfoEl.classList.add('text-white');
                    document.getElementById("hero-title").className = "text-sm font-semibold text-pink-300 mt-1 tracking-wide uppercase opacity-90";
                    document.getElementById("hero-subtitle").className = "text-sm text-gray-300 mt-2 px-6 leading-relaxed font-light";
                    socialContainer.className = "mt-10 pt-6 border-t border-white/10 flex justify-center gap-4 flex-wrap";
                    footerCredit.className = "text-center mt-12 text-xs tracking-wider uppercase font-medium text-white/40";
                    footerBrand.className = "font-semibold text-white/70";
                    if (searchCountEl) searchCountEl.className = "text-[11px] text-white/70 font-medium hidden";
                    if (searchHintEl) searchHintEl.className = "text-[10px] text-white/50 ml-auto";
                }
                renderSocialLinks(s, theme);
                initTrackingPixels(s);
            }
        }

        // RENDER KARTU PRODUK BERNOMOR LENGKAP (#1, #2, dst.)
        function renderProducts(ps) {
            const c = document.getElementById("products-container");
            if (!ps || !ps.length) { 
                c.innerHTML = `
                    <div class="text-center py-12 px-4 glass-card rounded-2xl">
                        <div class="text-3xl mb-2">🔍</div>
                        <p class="font-bold text-sm text-gray-800">Produk tidak ditemukan</p>

                        <button onclick="clearSearch()" class="mt-4 px-4 py-2 bg-pink-500 text-white rounded-xl text-xs font-bold hover:bg-pink-600 transition-all shadow">Tampilkan Semua Produk</button>
                    </div>
                `; 
                return; 
            }

            c.innerHTML = ps.map((p) => {
                const num = p._itemNumber;
                
                // Top 3 = Gold/Pink Gradient, Slot 4+ = Dark Obsidian Glass Badge
                const badge = num <= 3 
                    ? `<div class="absolute -top-2.5 -left-2.5 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-lg z-10 tracking-wider">TOP #${num}</div>`
                    : `<div class="absolute -top-2.5 -left-2.5 bg-gray-900/90 backdrop-blur-sm text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-md z-10 border border-white/30 tracking-wider">#${num}</div>`;
                
                const imgHtml = p.image_url 
                    ? `<img src="${getImageUrlWithCacheBust404(p.image_url)}" alt="${p.title || 'Produk'}" width="64" height="64" loading="lazy" decoding="async" class="w-16 h-16 rounded-xl object-cover shadow-md group-hover:scale-105 transition-transform duration-300" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="w-16 h-16 bg-gray-100 rounded-xl hidden items-center justify-center text-2xl shadow-inner">🛍️</div>`
                    : `<div class="w-16 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-2xl shadow-inner">🛍️</div>`;

                const productIdentifier = p.id || p.title || ('prod-' + num);
                const safeTitle = (p.title || '').replace(/"/g, '&quot;');
                const rawPrice = p.price || '';

                return `<div class="product-glass rounded-2xl p-3.5 shadow-xl relative overflow-hidden group">
                    <a href="${p.affiliate_link || '#'}" target="_blank" class="block" data-track-product="${productIdentifier}" data-product-title="${safeTitle}" data-product-price="${rawPrice}">
                        <div class="flex gap-4 items-center">
                            <div class="relative flex-shrink-0 w-16 h-16">${imgHtml}${badge}</div>
                            <div class="flex-1 min-w-0 pr-1">
                                <h3 class="font-bold text-gray-900 text-sm sm:text-base leading-snug line-clamp-2 group-hover:text-pink-600 transition-colors">${p.title || ''}</h3>
                                <p class="text-pink-600 font-extrabold text-sm sm:text-base mt-0.5">${fmt(p.price)}</p>
                                <div class="mt-2.5 inline-flex items-center gap-1.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-pink-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-md btn-shine transition-all">
                                    <span>Beli Sekarang</span>
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>`;
            }).join("");
        }

        // SISTEM PENCARIAN REAL-TIME
        function setupSearch() {
            const searchInput = document.getElementById("product-search");
            const clearBtn = document.getElementById("clear-search-btn");
            const countEl = document.getElementById("search-result-count");
            if (!searchInput) return;

            searchInput.addEventListener("input", (e) => {
                const query = e.target.value.trim().toLowerCase();
                if (!query) {
                    clearBtn.classList.add("hidden");
                    countEl.classList.add("hidden");
                    renderProducts(globalProducts);
                    return;
                }

                clearBtn.classList.remove("hidden");
                const cleanNum = query.replace(/[^0-9]/g, "");

                const filtered = globalProducts.filter(p => {
                    // 1. Cocokkan nomor etalase (ketik '5' atau '#5' akan menampilkan produk #5)
                    const matchNum = cleanNum && String(p._itemNumber) === cleanNum;
                    // 2. Cocokkan kata kunci di judul produk
                    const matchTitle = (p.title || "").toLowerCase().includes(query);
                    return matchNum || matchTitle;
                });

                countEl.textContent = `Ditemukan ${filtered.length} dari ${globalProducts.length} etalase`;
                countEl.classList.remove("hidden");
                renderProducts(filtered);
            });
        }

        function clearSearch() {
            const searchInput = document.getElementById("product-search");
            if (searchInput) {
                searchInput.value = "";
                searchInput.dispatchEvent(new Event("input"));
                searchInput.focus();
            }
        }
        
        async function init() {
            const slug = getSlug();

            if (!document.title || document.title === "Bio Link - Affiliate") {
                document.title = "Bio Link - " + slug;
            }

            setupSearch();
            sendEvent("view");

            const cacheKey = `bio_cache_${slug}`;
            await loadAndRender(slug, cacheKey);
        }
        function prepareAndRenderProducts(products) {
            // Berikan nomor urut permanen ke setiap produk
            globalProducts = (products || []).map((p, idx) => ({
                ...p,
                _itemNumber: idx + 1
            }));
            renderProducts(globalProducts);
        }

        // Helper for image cache busting
        let currentCacheTimestamp404 = 0;
        function getImageUrlWithCacheBust404(imageUrl) {
            if (!imageUrl) return "";
            const separator = imageUrl.includes("?") ? "async function loadAndRender(slug, cacheKey) {" : "?";
            return imageUrl + separator + "_cb=" + currentCacheTimestamp404;
        }

        async function loadAndRender(slug, cacheKey) {
            const data = await fetchStoreData(slug);
            const settings = data.settings;
            const products = data.products || [];
            try { sessionStorage.setItem(cacheKey, JSON.stringify({ settings, products })); } catch (e) {}
            prepareAndRenderProducts(products);
            renderHero(settings);
            // Set timestamp for image cache busting
            if (data.edgeInfo && data.edgeInfo.cacheTimestamp) {
                currentCacheTimestamp404 = data.edgeInfo.cacheTimestamp;
            }
        }

        async function backgroundSync(slug, cacheKey) {
            try {
                const data = await fetchStoreData(slug);
                sessionStorage.setItem(cacheKey, JSON.stringify({ settings: data.settings, products: data.products || [] }));
                prepareAndRenderProducts(data.products || []);
                if (data.settings) initTrackingPixels(data.settings);
            } catch (e) {}
        }
        
        document.addEventListener("DOMContentLoaded", init);

        document.addEventListener("click", (e) => {
            const productEl = e.target.closest("[data-track-product]");
            if (productEl) {
                const targetId = productEl.getAttribute("data-track-product") || "product";
                const pTitle = productEl.getAttribute("data-product-title") || "Produk";
                const pPrice = productEl.getAttribute("data-product-price") || "0";

                sendEvent("product_click", targetId);
                trackPixelProductClick(pTitle, pPrice);
                return;
            }

            const socialEl = e.target.closest("[data-track-social]");
            if (socialEl) {
                const network = socialEl.getAttribute("data-track-social") || "social";
                sendEvent("social_click", network);
            }
        });
    </script>
</body>
</html>
